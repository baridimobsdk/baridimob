[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baridimob"
version = "0.4.0"
description = "Open-source Python SDK for BaridiMob (Algérie Poste)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BaridiMob SDK contributors" }]
keywords = ["baridimob", "algerie-poste", "ccp", "payment", "sdk", "algeria"]
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
test = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0",
]
dev = [
    "baridimob[redis,test]",
]

[project.urls]
Homepage = "https://github.com/baridimobsdk/baridimob"
Repository = "https://github.com/baridimobsdk/baridimob"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
